steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/keystone-api:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/keystone-api:latest', '-f', 'infrastructure/cloudrun/Dockerfile', '.']

  # 2. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/keystone-api:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'replace'
      - 'infrastructure/cloudrun/service.yaml'
      - '--region=us-central1'

images:
  - 'gcr.io/$PROJECT_ID/keystone-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/keystone-api:latest'

timeout: 1200s
